name: Publish Horyzont update

on:
  push:
    branches: [main]
    paths:
      - horyzont/config.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horyzont-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build update archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          from horyzont.config import VERSION
          assert re.fullmatch(r"\d+\.\d+\.\d+", VERSION), VERSION
          spec = Path("packaging/horyzont.spec").read_text()
          assert re.search(r"^Version:\s+" + re.escape(VERSION) + r"$", spec, re.M)
          readme = Path("README.md").read_text()
          marker = "## Co nowego w wersji " + VERSION
          notes = readme.split(marker, 1)[1].split("\n## ", 1)[0].strip()
          Path("release-notes.md").write_text(notes + "\n")
          PY
          bash tools/make-release.sh
          echo "HORYZONT_VERSION=$(python3 -c 'from horyzont.config import VERSION; print(VERSION)')" >> "$GITHUB_ENV"
      - name: Publish version for Horyzont Updates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v$HORYZONT_VERSION" >/dev/null 2>&1; then
            echo "Release v$HORYZONT_VERSION already exists."
            exit 0
          fi
          gh release create "v$HORYZONT_VERSION" \
            "dist/horyzont-$HORYZONT_VERSION.tar.gz" dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Horyzont $HORYZONT_VERSION" \
            --notes-file release-notes.md --latest
